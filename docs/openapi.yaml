openapi: 3.0.3

info:
  title: API de Transações Imobiliárias
  description: Serviços REST para consulta de transações imobiliárias.
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:
  /api/soma-por-imovel:
    get:
      summary: Soma das vendas por imóvel
      responses:
        '200':
          description: Lista com o total de vendas por imóvel.
          content:
            application/json:
              example:
                - codigo_imovel: 1
                  descricao_imovel: "Apartamento 100m2 em condomínio fechado"
                  total_vendas: 20600
                - codigo_imovel: 2
                  descricao_imovel: "Apartamento 60m2 no centro"
                  total_vendas: 19800
                - codigo_imovel: 3
                  descricao_imovel: "Casa 3 quartos com quintal"
                  total_vendas: 13400
                - codigo_imovel: 4
                  descricao_imovel: "Casa geminada 2 quartos"
                  total_vendas: 12750
                - codigo_imovel: 5
                  descricao_imovel: "Sala comercial 40m2 no centro"
                  total_vendas: 10350
                - codigo_imovel: 6
                  descricao_imovel: "Sala comercial em galeria"
                  total_vendas: 10750
                - codigo_imovel: 7
                  descricao_imovel: "Terreno 500m2 em bairro residencial"
                  total_vendas: 28600
                - codigo_imovel: 8
                  descricao_imovel: "Galpão industrial 800m2"
                  total_vendas: 38600

  /api/vendas-por-mes:
    get:
      summary: Total de vendas por mês e ano
      responses:
        '200':
          description: Lista com o total de vendas agrupadas por mês e ano.
          content:
            application/json:
              example:
                - mesAno: "08/2023"
                  total: 16100
                - mesAno: "09/2023"
                  total: 26700
                - mesAno: "10/2023"
                  total: 23650
                - mesAno: "11/2023"
                  total: 29000
                - mesAno: "12/2023"
                  total: 33500
                - mesAno: "01/2024"
                  total: 25900

  /api/vendas-por-tipo:
    get:
      summary: Percentual de vendas por tipo de imóvel
      responses:
        '200':
          description: >-
            Lista, para cada tipo de imóvel, o valor total vendido e a quantidade de vendas,
            com o percentual de cada um sobre o total geral. O percentual é calculado pelas
            duas leituras do enunciado: sobre o valor total das vendas (percentualPorValor)
            e sobre a quantidade de vendas (percentualPorQuantidade).
          content:
            application/json:
              example:
                - tipoImovel: "Apartamento"
                  totalValor: 40400
                  percentualPorValor: 26.09
                  quantidadeVendas: 8
                  percentualPorQuantidade: 25
                - tipoImovel: "Casa"
                  totalValor: 26150
                  percentualPorValor: 16.89
                  quantidadeVendas: 8
                  percentualPorQuantidade: 25
                - tipoImovel: "Sala Comercial"
                  totalValor: 21100
                  percentualPorValor: 13.63
                  quantidadeVendas: 8
                  percentualPorQuantidade: 25
                - tipoImovel: "Terreno"
                  totalValor: 28600
                  percentualPorValor: 18.47
                  quantidadeVendas: 4
                  percentualPorQuantidade: 12.5
                - tipoImovel: "Galpão"
                  totalValor: 38600
                  percentualPorValor: 24.93
                  quantidadeVendas: 4
                  percentualPorQuantidade: 12.5