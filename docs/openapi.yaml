openapi: 3.0.3

info:
  title: API de Transações Imobiliárias
  description: Serviços REST para consulta de transações imobiliárias.
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:
  /api/soma-por-imovel:
    get:
      summary: Soma das vendas por imóvel
      responses:
        '200':
          description: Lista com o total de vendas por imóvel.
          content:
            application/json:
              example:
                codigo_imovel: 1
                descricao_imovel: "Apartamento 100m2 em condomínio fechado"
                total_vendas: 20400.00

  /api/vendas-por-mes:
    get:
      summary: Total de vendas por mês e ano
      responses:
        '200':
          description: Lista com o total de vendas agrupadas por mês e ano.
          content:
            application/json:
              example:
                - mesAno: "08/2023"
                  total: 16100
                - mesAno: "09/2023"
                  total: 26700
                - mesAno: "10/2023"
                  total: 23650
                - mesAno: "11/2023"
                  total: 29000
                - mesAno: "12/2023"
                  total: 33500
                - mesAno: "01/2024"
                  total: 25900

  /api/vendas-por-tipo:
    get:
      summary: Percentual de vendas por tipo de imóvel
      responses:
        '200':
          description: Lista com o total e percentual de vendas por tipo de imóvel.
          content:
            application/json:
              example:
                - tipoImovel: "Apartamento"
                  total: 40400
                  percentual: 26.09
                - tipoImovel: "Casa"
                  total: 26150
                  percentual: 16.89
                - tipoImovel: "Sala Comercial"
                  total: 21100
                  percentual: 13.63
                - tipoImovel: "Terreno"
                  total: 28600
                  percentual: 18.47
                - tipoImovel: "Galpão"
                  total: 38600
                  percentual: 24.93